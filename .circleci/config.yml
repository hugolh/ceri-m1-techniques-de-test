version: 2.1

orbs:
  codecov: codecov/codecov@4.0.1

jobs:
  build-and-test:
    docker:
      - image: cimg/openjdk:11.0
    steps:
      - checkout

      - run:
          name: Build
          command: mvn -B -DskipTests clean package

      - run:
          name: Test
          command: mvn test

      - run:
          name: Run Checkstyle
          command: mvn checkstyle:check

      - codecov/upload:
          file: ./target/site/jacoco/jacoco.xml

  build:
    docker:
      - image: cimg/openjdk:11.0
    steps:
      - checkout
      - run:
          name: Build Project
          command: mvn clean install

  package:
    docker:
      - image: cimg/openjdk:11.0
    steps:
      - checkout
      - run:
          name: "Package the JAR"
          command: mvn package

workflows:
  version: 2
  build_and_package:
    jobs:
      - build-and-test
      - build
      - package:
          requires:
            - build
