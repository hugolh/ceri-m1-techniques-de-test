version: 2.1

orbs:
  codecov: codecov/codecov@4.0.1

jobs:
  build-and-test:
    docker:
      - image: cimg/openjdk:11.0
    steps:
      - checkout
      - run:
          name: Build
          command: mvn -B -DskipTests clean package
      - run:
          name: Test
          command: mvn test
      - run:
          name: Run Checkstyle (Ignore Failures)
          command: mvn checkstyle:check || echo "Checkstyle violations found, but ignoring errors."
      - codecov/upload:
          file: ./target/site/jacoco/jacoco.xml
      - run:
          name: Generate Javadoc
          command: |
            mvn javadoc:javadoc || { echo "Javadoc generation failed"; exit 1; }

      - run:
          name: List Directory Contents
          command: ls -R target/site
      - run:
          name: Deploy Documentation to GitHub Pages
          command: |
            git config --global user.name "CircleCI Bot"
            git config --global user.email "circleci@example.com"
            
            # Check if the gh-pages branch exists; if not, initialize it as a new branch
            if git ls-remote --exit-code --heads https://github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git gh-pages; then
              git clone --single-branch --branch gh-pages ssh://git@github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git gh-pages
            else
              mkdir gh-pages
              cd gh-pages
              git init
              git checkout -b gh-pages
              git remote add origin ssh://git@github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git
            fi

            # Check if Javadoc files are present, exit if not found
            if [ ! -d "../target/site/apidocs" ]; then
              echo "Javadoc files not found, skipping deployment."
            else
              echo "Javadoc files found, proceeding with deployment."
            fi

            # Copy the generated Javadoc files
            cp -r ../target/site/apidocs/* gh-pages/
            cd gh-pages

            # Commit and push changes
            git add .
            git commit -m "Update documentation"
            git push -f origin gh-pages


  build:
    docker:
      - image: cimg/openjdk:11.0
    steps:
      - checkout
      - run:
          name: Build Project
          command: mvn clean install

  package:
    docker:
      - image: cimg/openjdk:11.0
    steps:
      - checkout
      - run:
          name: "Package the JAR"
          command: mvn package

workflows:
  version: 2
  build_and_package:
    jobs:
      - build-and-test
      - build
      - package:
          requires:
            - build
