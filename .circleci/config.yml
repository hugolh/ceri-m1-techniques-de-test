version: 2.1

orbs:
  codecov: codecov/codecov@4.0.1
  github-pages: peaceiris/actions-gh-pages@v3

jobs:
  build-and-test:
    docker:
      - image: cimg/openjdk:11.0
    steps:
      - checkout
      - run:
          name: Build
          command: mvn -B -DskipTests clean package
      - run:
          name: Test
          command: mvn test
      - run:
          name: Run Checkstyle (Ignore Failures)
          command: mvn checkstyle:check || echo "Checkstyle violations found, but ignoring errors."
      - codecov/upload:
          file: ./target/site/jacoco/jacoco.xml
      - run:
          name: Generate Javadoc
          command: mvn javadoc:javadoc
      - github-pages/deploy:
          branch: gh-pages
          folder: target/site/apidocs
          token: $GITHUB_TOKEN

  build:
    docker:
      - image: cimg/openjdk:11.0
    steps:
      - checkout
      - run:
          name: Build Project
          command: mvn clean install

  package:
    docker:
      - image: cimg/openjdk:11.0
    steps:
      - checkout
      - run:
          name: "Package the JAR"
          command: mvn package

workflows:
  version: 2
  build_and_package:
    jobs:
      - build-and-test
      - build
      - package:
          requires:
            - build
