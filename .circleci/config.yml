version: 2.1

orbs:
  codecov: codecov/codecov@4.0.1

jobs:
  build-and-test:
    docker:
      - image: cimg/openjdk:11.0
    steps:
      - checkout
      - run:
          name: Build
          command: mvn -B -DskipTests clean package
      - run:
          name: Test
          command: mvn test
      - run:
          name: Run Checkstyle (Ignore Failures)
          command: mvn checkstyle:check || echo "Checkstyle violations found, but ignoring errors."
      - codecov/upload:
          file: ./target/site/jacoco/jacoco.xml
      - run:
          name: Generate Javadoc
          command: mvn javadoc:javadoc
      - run:
          name: Deploy Documentation to GitHub Pages
          command: |
            git config --global user.name "CircleCI Bot"
            git config --global user.email "circleci@example.com"
            
            # Check if the gh-pages branch exists; if not, clone master or main as fallback
            git ls-remote --exit-code --heads https://github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git gh-pages || \
            git clone --single-branch --branch master https://github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git gh-pages || \
            git clone --single-branch --branch main https://github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git gh-pages
            cd gh-pages

            # Copy the generated Javadoc files
            cp -r ../target/site/apidocs/* .

            git add .
            git commit -m "Update documentation"
            
            # Push to gh-pages branch using SSH
            git push -f ssh://git@github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git gh-pages

  build:
    docker:
      - image: cimg/openjdk:11.0
    steps:
      - checkout
      - run:
          name: Build Project
          command: mvn clean install

  package:
    docker:
      - image: cimg/openjdk:11.0
    steps:
      - checkout
      - run:
          name: "Package the JAR"
          command: mvn package

workflows:
  version: 2
  build_and_package:
    jobs:
      - build-and-test
      - build
      - package:
          requires:
            - build
